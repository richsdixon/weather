name: Run ECMWF Gust Pipeline

on:
  schedule:
    - cron: '15 8,20 * * *' # 08:15 UTC and 20:15 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System C Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libgeos-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install xarray cfgrib ecmwf-opendata eccodes matplotlib numpy cartopy shapely

      - name: Execute Main Script
        run: python gusts.py

      - name: Commit and Push Summary Image
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gust_summary_2x2.png
          git commit -m "Auto-update forecast gust summary [skip ci]" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main --force-with-lease

      - name: Upload Plot as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gust-summary-plot
          path: gust_summary_2x2.png

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: run-pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
